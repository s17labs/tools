<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer | s17 Labs Tools</title>
    <meta name="description" content="A fast, free, and secure batch image resizer by s17 Labs. Resize single or multiple images locally in your browser with aspect ratio locking and high-quality output.">
    <link rel="icon" type="image/x-icon" href="https://s17labs.github.io/src/assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #0e0e10;
            --accent: #ff4136;
            --primary-text: #f1f1f1;
            --secondary-text: #868686;
            --surface: #141416;
            --surface-2: #1a1a1c;
            --border: rgba(255,255,255,0.07);
            --accent-dim: rgba(255,65,54,0.12);
            --radius: 4px;
            --t: 0.25s ease;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--primary);
            color: var(--primary-text);
            font-family: Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .page { width: 100%; max-width: 900px; padding: 0 20px 28px; display: flex; flex-direction: column; }
        .tool-header { width: 100%; text-align: center; margin: 2.5rem 0 0.4rem; position: relative; display: flex; justify-content: center; align-items: center; min-height: 2.8rem; }
        .back-link { position: absolute; left: 0; color: var(--secondary-text); font-size: 1rem; display: inline-flex; align-items: center; gap: 0.45rem; text-decoration: none; transition: var(--t); }
        .back-link:hover { color: var(--accent); }
        .tool-header h1 { font-family: Aldrich, sans-serif; font-size: 1.8rem; display: inline-flex; align-items: center; gap: .25em; }
        .cube { width: .82em; height: .82em; background: var(--accent); transform: translateY(-0.12em); }
        .tool-desc { text-align: center; color: var(--secondary-text); font-size: .95rem; margin: .6rem auto 2rem; line-height: 1.55; max-width: 760px; }
        .panel { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.4rem; }
        #drop-zone { border: 1px dashed var(--border); border-radius: var(--radius); padding: 30px 20px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.01); transition: var(--t); margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #drop-zone:hover, #drop-zone.hover { border-color: var(--accent); background: var(--accent-dim); }
        .upload-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 5px; }
        #drop-text { font-weight: 600; }
        .sub-text { font-size: 0.85rem; color: var(--secondary-text); }
        #preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 240px; margin-top: 15px; }
        .thumb-container { position: relative; width: 100%; aspect-ratio: 1; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
        .thumb { width: 100%; height: 100%; object-fit: cover; }
        .more-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; }
        .controls { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
        .input-row { display: flex; gap: 12px; }
        .input-group { flex: 1; min-width: 0; }
        label { font-size: .74rem; color: var(--secondary-text); text-transform: uppercase; letter-spacing: .09em; display: block; margin-bottom: 6px; }
        input[type="number"] { width: 100%; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; color: var(--primary-text); outline: none; }
        input[type="number"]:focus { border-color: rgba(255,65,54,0.5); }
        .aspect-row { display: flex; align-items: center; gap: 12px; font-size: .95rem; cursor: pointer; }
        .aspect-row input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
        #download-btn { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-weight: 700; font-size: .95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #download-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
    </style>
</head>
<body>
<div class="page">
    <header class="tool-header">
        <a class="back-link" href="../"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1><span class="cube"></span> Image Resizer</h1>
    </header>
    <p class="tool-desc">Resize one image or whole batches directly in your browser with no uploads. Keep aspect ratio locked and download instantly.</p>

    <main class="panel">
        <div id="drop-zone">
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <div id="drop-text">Drag & drop images or click to upload</div>
            <div class="sub-text">(Batch resizing supported)</div>
            <div id="preview-grid"></div>
            <input type="file" id="file-input" accept="image/*" multiple hidden>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label>Width (px)</label>
                    <input type="number" id="width-input" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Height (px)</label>
                    <input type="number" id="height-input" placeholder="0">
                </div>
            </div>
            <label class="aspect-row">
                <input type="checkbox" id="aspect-lock" checked>
                <span>Lock Aspect Ratio</span>
            </label>
        </div>

        <button id="download-btn" disabled>
            <i class="fa-solid fa-download"></i>
            <span id="btn-text">Download Image</span>
        </button>
    </main>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const widthInput = document.getElementById('width-input');
    const heightInput = document.getElementById('height-input');
    const aspectLock = document.getElementById('aspect-lock');
    const downloadBtn = document.getElementById('download-btn');
    const btnText = document.getElementById('btn-text');
    const previewGrid = document.getElementById('preview-grid');

    let imageFiles = [];
    let baseRatio = 1;

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('hover');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('hover'); handleFiles(e.dataTransfer.files); };
    fileInput.onchange = (e) => handleFiles(e.target.files);

    function updatePreviewGallery(allFiles) {
        previewGrid.innerHTML = '';
        const limit = 6;
        const total = allFiles.length;
        allFiles.slice(0, limit).forEach((fileData, index) => {
            const container = document.createElement('div');
            container.className = 'thumb-container';
            const img = document.createElement('img');
            img.src = fileData.preview;
            img.className = 'thumb';
            container.appendChild(img);
            if (total > limit && index === limit - 1) {
                const overlay = document.createElement('div');
                overlay.className = 'more-overlay';
                overlay.innerText = `+${total - (limit - 1)}`;
                container.appendChild(overlay);
            }
            previewGrid.appendChild(container);
        });
    }

    function handleFiles(files) {
        if (!files.length) return;
        imageFiles = [];
        const fileArray = Array.from(files);
        btnText.innerText = fileArray.length > 1 ? 'Download Images' : 'Download Image';

        let loadedCount = 0;
        fileArray.forEach((file) => {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    if (imageFiles.length === 0) {
                        widthInput.value = img.width;
                        heightInput.value = img.height;
                        baseRatio = img.width / img.height;
                    }
                    const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    imageFiles.push({ img, name: originalName, preview: e.target.result });
                    loadedCount++;
                    if (loadedCount === fileArray.length) updatePreviewGallery(imageFiles);
                    downloadBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    widthInput.oninput = () => { if (aspectLock.checked) heightInput.value = Math.round(widthInput.value / baseRatio); };
    heightInput.oninput = () => { if (aspectLock.checked) widthInput.value = Math.round(heightInput.value * baseRatio); };

    downloadBtn.onclick = async () => {
        const targetW = parseInt(widthInput.value);
        const targetH = parseInt(heightInput.value);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = targetW;
        canvas.height = targetH;

        if (imageFiles.length === 1) {
            ctx.drawImage(imageFiles[0].img, 0, 0, targetW, targetH);
            const link = document.createElement('a');
            link.download = `${imageFiles[0].name}-resized.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.85);
            link.click();
        } else {
            const originalBtnContent = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            const zip = new JSZip();
            for (const item of imageFiles) {
                ctx.clearRect(0, 0, targetW, targetH);
                ctx.drawImage(item.img, 0, 0, targetW, targetH);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                zip.file(`${item.name}-resized.jpg`, dataUrl.split(',')[1], { base64: true });
            }
            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${imageFiles.length}-batch-resized-images.zip`;
            link.click();
            downloadBtn.innerHTML = originalBtnContent;
        }
    };
</script>
</body>
</html>
