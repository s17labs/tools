<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Maker — s17 Labs</title>
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/js/all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #141416;
      --surface-2: #1a1a1c;
      --surface-3: #222226;
      --border: rgba(255,255,255,0.07);
      --accent: #ff4136;
      --accent-dim: rgba(255,65,54,0.15);
      --android: #3ddc84;
      --android-dim: rgba(61,220,132,0.12);
      --text: #f1f1f1;
      --muted: #868686;
      --radius: 6px;
      --t: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Verdana, sans-serif;
      font-size: 0.9rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
      -webkit-font-smoothing: antialiased;
    }

    body::-webkit-scrollbar { display: none; }

    /* ── Header ── */
    .header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-family: Aldrich, sans-serif;
      font-size: 1.4rem; line-height: 1;
      display: flex; align-items: center; gap: 0.3em;
    }

    .header-sub { margin-left: auto; color: var(--muted); font-size: 0.8rem; }

    /* ── Layout ── */
    .workspace {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 1.5rem;
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .panel-title {
      font-family: Aldrich, sans-serif;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    /* ── Preview ── */
    .preview-panel { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

    .canvas-wrapper {
      width: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: 2rem;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      min-height: 280px;
    }

    #preview-container { display: flex; align-items: center; justify-content: center; }

    .preview-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }

    .preview-badge {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 3px; padding: 0.25rem 0.6rem;
      font-size: 0.75rem; color: var(--muted);
      font-family: 'Courier New', monospace;
    }

    .preview-badge span { color: var(--text); }

    /* ── Controls column ── */
    .controls-col { display: flex; flex-direction: column; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: 0.5rem; }

    label {
      font-size: 0.76rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    input[type="text"] {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Courier New', monospace; font-size: 0.9rem;
      padding: 0.65rem 0.85rem; width: 100%; outline: none;
      transition: border-color var(--t);
    }

    input[type="text"]:focus { border-color: rgba(255,65,54,0.5); }
    input[type="text"]::placeholder { color: var(--muted); opacity: 0.5; }

    /* Colors */
    .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .color-field { display: flex; flex-direction: column; gap: 0.5rem; }

    .color-picker-wrap {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 0.5rem 0.75rem;
      cursor: pointer; transition: border-color var(--t);
    }

    .color-picker-wrap:hover { border-color: rgba(255,65,54,0.4); }

    input[type="color"] {
      width: 22px; height: 22px; border: none; border-radius: 3px;
      padding: 0; cursor: pointer; background: none; flex-shrink: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .color-hex { font-family: 'Courier New', monospace; font-size: 0.82rem; color: var(--text); }

    /* Shape buttons */
    .shape-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }

    .shape-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
      padding: 0.6rem 0.3rem;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
      transition: all var(--t); color: var(--muted);
      font-size: 0.7rem; font-family: Verdana, sans-serif;
    }

    .shape-btn:hover { border-color: rgba(255,65,54,0.4); color: var(--text); }
    .shape-btn.active { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

    .shape-icon { width: 22px; height: 22px; background: currentColor; opacity: 0.6; }
    .shape-icon.circle { border-radius: 50%; }
    .shape-icon.rounded { border-radius: 5px; }
    .shape-icon.square { border-radius: 0; }
    .shape-icon.none { background: none; border: 1.5px dashed currentColor; border-radius: 3px; opacity: 1; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

    /* Range */
    input[type="range"] {
      width: 100%; -webkit-appearance: none;
      height: 3px; background: var(--surface-3); border-radius: 99px; outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
    }

    /* Preset grid */
    .preset-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem; margin-bottom: 0.75rem;
    }

    .preset-btn {
      padding: 0.45rem 0.3rem;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--muted);
      font-size: 0.73rem; font-family: 'Courier New', monospace;
      cursor: pointer; text-align: center; transition: all var(--t);
    }

    .preset-btn:hover { border-color: rgba(255,65,54,0.4); color: var(--text); }
    .preset-btn.active { border-color: var(--accent); background: var(--accent-dim); color: var(--text); }

    .custom-res { display: flex; gap: 0.5rem; align-items: center; }
    .custom-res span { color: var(--muted); font-size: 0.85rem; flex-shrink: 0; }

    /* Export buttons */
    .export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }

    .export-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface-2);
      color: var(--muted); font-family: Verdana, sans-serif;
      font-size: 0.82rem; cursor: pointer; transition: all var(--t);
    }

    .export-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    .fmt {
      font-family: Aldrich, sans-serif; font-size: 0.85rem;
      color: var(--accent); transition: color var(--t);
    }

    .export-btn:hover .fmt { color: #fff; }

    /* ── Android Export Button ── */
    .android-divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 1rem 0 0.75rem;
    }

    .android-divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }

    .android-divider span {
      font-size: 0.7rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap;
    }

    .android-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 0.65rem;
      padding: 0.85rem 1rem;
      background: var(--android-dim);
      border: 1px solid rgba(61,220,132,0.25);
      border-radius: var(--radius);
      color: var(--android);
      font-family: Verdana, sans-serif; font-size: 0.85rem;
      cursor: pointer; transition: all var(--t);
      position: relative; overflow: hidden;
    }

    .android-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(61,220,132,0.07), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .android-btn:hover::before { transform: translateX(100%); }

    .android-btn:hover {
      background: rgba(61,220,132,0.18);
      border-color: rgba(61,220,132,0.5);
      color: #5eeaa0;
    }

    .android-btn:disabled {
      opacity: 0.5; cursor: not-allowed;
    }

    .android-btn .android-label {
      font-family: Aldrich, sans-serif; font-size: 0.88rem;
      color: var(--android); transition: color var(--t);
    }

    .android-btn:hover .android-label { color: #5eeaa0; }

    .android-btn .android-sub {
      font-size: 0.72rem; color: rgba(61,220,132,0.6); margin-left: 0.2rem;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 0.75rem;
      display: none;
    }

    .progress-wrap.visible { display: block; }

    .progress-bar-track {
      width: 100%; height: 3px;
      background: var(--surface-3); border-radius: 99px; overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%; width: 0%;
      background: var(--android);
      border-radius: 99px;
      transition: width 0.15s ease;
    }

    .progress-label {
      font-size: 0.72rem; color: var(--muted);
      margin-top: 0.4rem; text-align: center;
      font-family: 'Courier New', monospace;
    }

    /* Android preview grid */
    .android-preview {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .android-preview.visible { display: flex; }

    .android-preview-title {
      font-size: 0.72rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em;
    }

    .android-sizes-row {
      display: flex; gap: 0.75rem; align-items: flex-end; flex-wrap: wrap;
    }

    .android-size-item {
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    }

    .android-size-item canvas {
      border-radius: 3px;
      border: 1px solid var(--border);
    }

    .android-size-item span {
      font-size: 0.65rem; color: var(--muted);
      font-family: 'Courier New', monospace;
    }

    /* Error */
    .error-msg {
      color: var(--accent); font-size: 0.78rem;
      min-height: 1.1em; opacity: 0; transition: opacity var(--t);
    }

    .error-msg.visible { opacity: 1; }

    /* Placeholder */
    .icon-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      color: var(--muted); opacity: 0.35;
    }

    .icon-placeholder svg { width: 44px; height: 44px; fill: currentColor; }
    .icon-placeholder p { font-size: 0.8rem; }

    @media (max-width: 700px) {
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="header">
  <h1>Icon Maker</h1>
  <span class="header-sub">s17 Labs</span>
</header>

<div class="workspace">

  <!-- Preview -->
  <div class="panel preview-panel">
    <div class="panel-title">Preview</div>
    <div class="canvas-wrapper">
      <div id="preview-container">
        <div class="icon-placeholder" id="placeholder">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <p>Enter an icon name to begin</p>
        </div>
      </div>
    </div>
    <div class="preview-meta" id="preview-meta" style="display:none;">
      <div class="preview-badge">icon: <span id="meta-icon">—</span></div>
      <div class="preview-badge">color: <span id="meta-color">—</span></div>
      <div class="preview-badge">bg: <span id="meta-bg">—</span></div>
    </div>

    <!-- Android size preview (shown after export prep) -->
    <div class="android-preview" id="android-preview">
      <div class="android-preview-title">Android Adaptive Preview</div>
      <div class="android-sizes-row" id="android-sizes-row"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-col">

    <div class="panel">
      <div class="panel-title">Icon</div>
      <div class="field">
        <label>Font Awesome Icon Name</label>
        <input type="text" id="icon-input" placeholder="e.g. star, circle-check, bolt" spellcheck="false" autocomplete="off">
        <div class="error-msg" id="error-msg">Icon not found — check spelling at fontawesome.com/icons</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Colors</div>
      <div class="color-row">
        <div class="color-field">
          <label>Icon Color</label>
          <div class="color-picker-wrap" onclick="document.getElementById('icon-color').click()">
            <input type="color" id="icon-color" value="#ffffff">
            <span class="color-hex" id="icon-color-hex">#ffffff</span>
          </div>
        </div>
        <div class="color-field">
          <label>Background</label>
          <div class="color-picker-wrap" onclick="document.getElementById('bg-color').click()">
            <input type="color" id="bg-color" value="#ff4136">
            <span class="color-hex" id="bg-color-hex">#ff4136</span>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Background Shape</div>
      <div class="shape-row">
        <button class="shape-btn" data-shape="none" onclick="setShape('none')">
          <div class="shape-icon none"></div>None
        </button>
        <button class="shape-btn active" data-shape="circle" onclick="setShape('circle')">
          <div class="shape-icon circle"></div>Circle
        </button>
        <button class="shape-btn" data-shape="rounded" onclick="setShape('rounded')">
          <div class="shape-icon rounded"></div>Rounded
        </button>
        <button class="shape-btn" data-shape="square" onclick="setShape('square')">
          <div class="shape-icon square"></div>Square
        </button>
      </div>
      <hr class="divider">
      <div class="field">
        <label>Icon Scale — <span id="size-label">70%</span></label>
        <input type="range" id="icon-scale" min="20" max="90" value="70">
      </div>
    </div>

    <!-- Export -->
    <div class="panel">
      <div class="panel-title">Export</div>

      <label style="display:block;margin-bottom:0.5rem;">Resolution Presets</label>
      <div class="preset-grid">
        <button class="preset-btn" onclick="setPreset(16)">16px</button>
        <button class="preset-btn" onclick="setPreset(32)">32px</button>
        <button class="preset-btn" onclick="setPreset(64)">64px</button>
        <button class="preset-btn active" onclick="setPreset(128)">128px</button>
        <button class="preset-btn" onclick="setPreset(256)">256px</button>
        <button class="preset-btn" onclick="setPreset(512)">512px</button>
        <button class="preset-btn" onclick="setPreset(1024)">1024px</button>
        <button class="preset-btn" onclick="setPreset(2048)">2048px</button>
      </div>

      <label style="display:block;margin-bottom:0.5rem;">Custom Size</label>
      <div class="custom-res">
        <input type="text" id="custom-w" value="128" style="text-align:center;">
        <span>×</span>
        <input type="text" id="custom-h" value="128" style="text-align:center;">
        <span>px</span>
      </div>

      <div class="export-row">
        <button class="export-btn" onclick="exportAs('svg')"><span class="fmt">SVG</span> Export</button>
        <button class="export-btn" onclick="exportAs('png')"><span class="fmt">PNG</span> Export</button>
      </div>

      <!-- Android export section -->
      <div class="android-divider">
        <hr><span>Android</span><hr>
      </div>

      <button class="android-btn" id="android-btn" onclick="exportAndroid()">
        <i class="fa-brands fa-android" style="font-size:1.1rem;"></i>
        <span>
          <span class="android-label">Export Android Package</span>
          <span class="android-sub">· .zip</span>
        </span>
      </button>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">Preparing…</div>
      </div>
    </div>

  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const S = {
  iconName: '', iconColor: '#ffffff', bgColor: '#ff4136',
  bgShape: 'circle', iconScale: 70,
  paths: null, viewBox: '0 0 512 512', valid: false
};

// ── FA API lookup ──────────────────────────────────────────────────────────────
function findIcon(name) {
  if (!window.FontAwesome) return null;
  for (const prefix of ['fas','far','fab','fal','fat']) {
    try {
      const def = window.FontAwesome.findIconDefinition({ prefix, iconName: name });
      if (def?.icon) {
        const [w, h, , , pd] = def.icon;
        return { paths: Array.isArray(pd) ? pd : [pd], viewBox: `0 0 ${w} ${h}` };
      }
    } catch(e) {}
  }
  return null;
}

// ── Build SVG ─────────────────────────────────────────────────────────────────
// shapeOverride lets us force a specific shape without mutating state
function buildSVG(shapeOverride) {
  const shape = shapeOverride ?? S.bgShape;
  const { paths, viewBox, iconColor, bgColor, iconScale } = S;
  const pad = (100 - iconScale) / 2;
  const rx = shape === 'circle' ? 50 : shape === 'rounded' ? 14 : 0;
  const bgEl = shape !== 'none'
    ? `<rect width="100" height="100" fill="${bgColor}" rx="${rx}"/>`
    : '';
  const pathEls = paths.map((d, i) =>
    `<path d="${d}" fill="${iconColor}"${paths.length > 1 && i === 0 ? ' opacity="0.4"' : ''}/>` 
  ).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${bgEl}<svg x="${pad}" y="${pad}" width="${iconScale}" height="${iconScale}" viewBox="${viewBox}">${pathEls}</svg></svg>`;
}

// ── Render preview ────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('preview-container');
  const placeholder = document.getElementById('placeholder');
  const meta = document.getElementById('preview-meta');
  const old = container.querySelector('svg.live');

  if (!S.valid) {
    placeholder.style.display = '';
    meta.style.display = 'none';
    if (old) old.remove();
    return;
  }

  placeholder.style.display = 'none';
  meta.style.display = '';

  const svg = new DOMParser().parseFromString(buildSVG(), 'image/svg+xml').documentElement;
  svg.classList.add('live');
  svg.style.cssText = 'width:180px;height:180px;display:block;';
  if (old) old.replaceWith(svg); else container.appendChild(svg);

  document.getElementById('meta-icon').textContent = S.iconName;
  document.getElementById('meta-color').textContent = S.iconColor;
  document.getElementById('meta-bg').textContent = S.bgShape === 'none' ? 'transparent' : S.bgColor;
}

// ── Inputs ────────────────────────────────────────────────────────────────────
let timer;
document.getElementById('icon-input').addEventListener('input', function() {
  clearTimeout(timer);
  const name = this.value.trim().toLowerCase().replace(/^fa[srbl]?-/,'');
  timer = setTimeout(() => {
    if (!name) { S.valid = false; err(false); render(); return; }
    const r = findIcon(name);
    if (r) { Object.assign(S, { iconName: name, paths: r.paths, viewBox: r.viewBox, valid: true }); err(false); }
    else { S.valid = false; err(true); }
    render();
  }, 300);
});

function err(show) { document.getElementById('error-msg').classList.toggle('visible', show); }

document.getElementById('icon-color').addEventListener('input', function() {
  S.iconColor = this.value;
  document.getElementById('icon-color-hex').textContent = this.value;
  render();
});

document.getElementById('bg-color').addEventListener('input', function() {
  S.bgColor = this.value;
  document.getElementById('bg-color-hex').textContent = this.value;
  render();
});

function setShape(s) {
  S.bgShape = s;
  document.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === s));
  render();
}

document.getElementById('icon-scale').addEventListener('input', function() {
  S.iconScale = +this.value;
  document.getElementById('size-label').textContent = this.value + '%';
  render();
});

// ── Resolution presets ────────────────────────────────────────────────────────
function setPreset(px) {
  document.getElementById('custom-w').value = px;
  document.getElementById('custom-h').value = px;
  document.querySelectorAll('.preset-btn').forEach(b =>
    b.classList.toggle('active', b.textContent === px + 'px'));
}

['custom-w','custom-h'].forEach(id =>
  document.getElementById(id).addEventListener('input', () =>
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'))
  )
);

// ── Standard export ───────────────────────────────────────────────────────────
function exportAs(fmt) {
  if (!S.valid) { alert('Enter a valid icon name first.'); return; }
  const w = +document.getElementById('custom-w').value || 128;
  const h = +document.getElementById('custom-h').value || 128;
  const markup = buildSVG();
  const fname = `${S.iconName}-icon`;

  if (fmt === 'svg') { dl(URL.createObjectURL(new Blob([markup], {type:'image/svg+xml'})), fname + '.svg'); return; }

  svgToPngBlob(markup, w, h).then(b => dl(URL.createObjectURL(b), `${fname}-${w}x${h}.png`));
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function dl(url, name) { Object.assign(document.createElement('a'), {href:url, download:name}).click(); }

function svgToPngBlob(svgMarkup, w, h) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([svgMarkup], {type:'image/svg+xml;charset=utf-8'}));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(resolve, 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

// ── Android VectorDrawable XML ────────────────────────────────────────────────
function buildForegroundXML() {
  // Android adaptive foreground: 108×108dp canvas, icon lives in center 72×72 safe zone
  const [,,vbW,vbH] = S.viewBox.split(' ').map(Number);
  const scale = 72 / Math.max(vbW, vbH);
  const scaledW = vbW * scale, scaledH = vbH * scale;
  const tx = (18 + (72 - scaledW) / 2).toFixed(4);
  const ty = (18 + (72 - scaledH) / 2).toFixed(4);
  const sc = scale.toFixed(6);

  const pathEls = S.paths.map((d, i) => {
    const alpha = S.paths.length > 1 && i === 0 ? '\n        android:fillAlpha="0.4"' : '';
    return `    <path\n        android:fillColor="${S.iconColor}"${alpha}\n        android:pathData="${d}"/>`;
  }).join('\n');

  return `<?xml version="1.0" encoding="utf-8"?>
<!-- Adaptive icon foreground — generated by s17 Labs Icon Maker -->
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <!--
        Safe zone: center 72×72dp (18dp padding on each side).
        Icon scaled from ${S.viewBox} → fits within safe zone.
    -->
    <group
        android:translateX="${tx}"
        android:translateY="${ty}"
        android:scaleX="${sc}"
        android:scaleY="${sc}">
${pathEls}
    </group>
</vector>`;
}

function buildBackgroundXML(color) {
  return `<?xml version="1.0" encoding="utf-8"?>
<!-- Adaptive icon background — generated by s17 Labs Icon Maker -->
<shape xmlns:android="http://schemas.android.com/apk/res/android">
    <solid android:color="${color}"/>
</shape>`;
}

function buildAdaptiveIconXML(monochrome = false) {
  const mono = monochrome
    ? `\n    <!-- Monochrome layer for Android 13+ themed icons -->\n    <monochrome android:drawable="@drawable/ic_launcher_foreground"/>`
    : '';
  return `<?xml version="1.0" encoding="utf-8"?>
<!-- Adaptive icon — generated by s17 Labs Icon Maker -->
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@drawable/ic_launcher_background"/>
    <foreground android:drawable="@drawable/ic_launcher_foreground"/>${mono}
</adaptive-icon>`;
}

function buildColorsXML(color) {
  return `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <!-- Launcher icon background color — generated by s17 Labs Icon Maker -->
    <color name="ic_launcher_background">${color}</color>
</resources>`;
}

function buildReadme() {

Generated by s17 Labs Icon Maker — https://s17labs.github.io
Icon: ${S.iconName}
Icon Color: ${S.iconColor}
Background Color: ${S.bgColor}
Generated: ${new Date().toISOString()}

DROP-IN INSTRUCTIONS

2. Copy all drawable* folders into  app/src/main/res/
3. Copy values/ into               app/src/main/res/
4. In AndroidManifest.xml confirm:
     android:icon="@mipmap/ic_launcher"
     android:roundIcon="@mipmap/ic_launcher_round"

PACKAGE CONTENTS

mipmap-mdpi/
  ic_launcher.png         48 × 48 px   (square)
  ic_launcher_round.png   48 × 48 px   (circular)

mipmap-hdpi/
  ic_launcher.png         72 × 72 px
  ic_launcher_round.png   72 × 72 px

mipmap-xhdpi/

  ic_launcher_round.png   96 × 96 px

ADAPTIVE ICONS (Android 8.0 / API 26+)
The adaptive icon system separates the launcher icon into two layers:
  • Background: solid color shape (ic_launcher_background.xml)
  • Foreground: vector drawable centered in 108dp canvas with a
    72dp safe zone (18dp padding). Your device's launcher applies

MONOCHROME (Android 13 / API 33+)
Themed icons are supported. The <monochrome> element reuses the
foreground drawable; Android tints it automatically to match the

}

// ── Android export ────────────────────────────────────────────────────────────
async function exportAndroid() {
  if (!S.valid) { alert('Enter a valid icon name first.'); return; }
  if (typeof JSZip === 'undefined') { alert('JSZip failed to load. Please check your connection.'); return; }

  const btn = document.getElementById('android-btn');
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  const progressLabel = document.getElementById('progress-label');

  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span><span class="android-label">Building package…</span></span>`;
  progressWrap.classList.add('visible');

  function setProgress(pct, label) {
    progressFill.style.width = pct + '%';
    progressLabel.textContent = label;
  }

  try {
    const zip = new JSZip();
    const safeName = S.iconName.replace(/-/g, '_');

    // Mipmap sizes: [density, square-size]
    const densities = [
      ['mdpi',    48],
      ['hdpi',    72],
      ['xhdpi',   96],
      ['xxhdpi',  144],
      ['xxxhdpi', 192],
    ];

    const totalSteps = densities.length * 2 + 1; // square + round per density + play store
    let step = 0;

    function nextStep(label) {
      step++;
      setProgress(Math.round((step / totalSteps) * 80), label);
    }

    // Generate square launcher icons (using current shape setting)
    for (const [density, size] of densities) {
      const squareSVG = buildSVG(); // use current bgShape
      const squareBlob = await svgToPngBlob(squareSVG, size, size);
      zip.folder(`mipmap-${density}`).file('ic_launcher.png', squareBlob);
      nextStep(`mipmap-${density}/ic_launcher.png (${size}px)`);

      // Round icon: always use circle clipping regardless of current shape
      const roundSVG = buildSVG('circle');
      const roundBlob = await svgToPngBlob(roundSVG, size, size);
      zip.folder(`mipmap-${density}`).file('ic_launcher_round.png', roundBlob);
      nextStep(`mipmap-${density}/ic_launcher_round.png (${size}px)`);
    }

    // Play Store icon 512×512
    setProgress(82, 'play_store_icon.png (512px)…');
    const playBlob = await svgToPngBlob(buildSVG(), 512, 512);
    zip.file('play_store_icon.png', playBlob);

    // ── XML files ──
    setProgress(86, 'Building adaptive icon XMLs…');

    // mipmap-anydpi-v26 adaptive icons (API 26+, includes monochrome for API 33+)
    const adaptiveXML = buildAdaptiveIconXML(true);
    zip.folder('mipmap-anydpi-v26').file('ic_launcher.xml', adaptiveXML);
    zip.folder('mipmap-anydpi-v26').file('ic_launcher_round.xml', adaptiveXML);

    // drawable: background + foreground
    setProgress(89, 'Building vector drawables…');
    const bgXML = buildBackgroundXML(S.bgColor);
    const fgXML = buildForegroundXML();
    zip.folder('drawable').file('ic_launcher_background.xml', bgXML);
    zip.folder('drawable').file('ic_launcher_foreground.xml', fgXML);

    // drawable-v24: explicit API 24+ copy of foreground
    zip.folder('drawable-v24').file('ic_launcher_foreground.xml', fgXML);

    // values/colors.xml
    setProgress(92, 'Building values/colors.xml…');
    zip.folder('values').file('colors.xml', buildColorsXML(S.bgColor));

    // README
    zip.file('README.txt', buildReadme());

    // ── Generate ZIP ──
    setProgress(95, 'Compressing…');
    const zipBlob = await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      compressionOptions: { level: 6 }
    });

    setProgress(100, `Done — ${densities.length * 2 + 1} images + XML files`);

    // Show android preview thumbnails
    showAndroidPreview(densities);

    // Trigger download
    dl(URL.createObjectURL(zipBlob), `${safeName}-android-icons.zip`);

    // Reset button after short delay
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-brands fa-android" style="font-size:1.1rem;"></i><span><span class="android-label">Export Android Package</span><span class="android-sub"> · .zip</span></span>`;
      progressWrap.classList.remove('visible');
    }, 2500);

  } catch(e) {
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-brands fa-android" style="font-size:1.1rem;"></i><span><span class="android-label">Export Android Package</span><span class="android-sub"> · .zip</span></span>`;
    progressWrap.classList.remove('visible');
    alert('Export failed: ' + e.message);
  }
}

// ── Android preview thumbnails ────────────────────────────────────────────────
async function showAndroidPreview(densities) {
  const container = document.getElementById('android-sizes-row');
  const panel = document.getElementById('android-preview');
  container.innerHTML = '';

  const previewSizes = [[48,'mdpi'],[96,'xhdpi'],[144,'xxhdpi'],[192,'xxxhdpi']];

  for (const [size, label] of previewSizes) {
    const svg = buildSVG('circle');
    const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml;charset=utf-8'}));
    const img = new Image();

    await new Promise(res => {
      img.onload = () => {
        const displaySize = Math.min(size, 56); // cap preview display size
        const c = document.createElement('canvas');
        c.width = displaySize; c.height = displaySize;
        c.getContext('2d').drawImage(img, 0, 0, displaySize, displaySize);
        URL.revokeObjectURL(url);

        const item = document.createElement('div');
        item.className = 'android-size-item';
        const sp = document.createElement('span');
        sp.textContent = label;
        item.appendChild(c);
        item.appendChild(sp);
        container.appendChild(item);
        res();
      };
      img.src = url;
    });
  }

  panel.classList.add('visible');
}
