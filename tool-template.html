<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Name | s17 Labs Tools</title>
  <meta name="description" content="Short description of what this tool does.">
  <link rel="icon" type="image/x-icon" href="https://s17labs.github.io/src/assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary:#0e0e10; --accent:#ff4136; --primary-text:#f1f1f1; --secondary-text:#868686;
      --surface-2:#1a1a1c; --border:rgba(255,255,255,0.07); --accent-dim:rgba(255,65,54,0.12);
      --radius:4px; --t:0.25s ease;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--primary); color:var(--primary-text); font-family:Verdana,sans-serif; min-height:100vh; display:flex; justify-content:center; }
    .page { width:100%; max-width:900px; padding:0 20px 28px; display:flex; flex-direction:column; }
    .tool-header { width:100%; text-align:center; margin:2.5rem 0 .4rem; position:relative; display:flex; justify-content:center; align-items:center; min-height:2.8rem; }
    .back-link { position:absolute; left:0; color:var(--secondary-text); font-size:1rem; display:inline-flex; align-items:center; gap:.45rem; text-decoration:none; transition:var(--t); }
    .back-link:hover { color:var(--accent); }
    .tool-header h1 { font-family:Aldrich,sans-serif; font-size:1.8rem; display:inline-flex; align-items:center; gap:.25em; }
    .cube { width:.82em; height:.82em; background:var(--accent); transform:translateY(-.12em); }
    .tool-desc { text-align:center; color:var(--secondary-text); font-size:.95rem; margin:.6rem auto 2rem; line-height:1.55; max-width:760px; }
    .panel { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--radius); padding:1.4rem; }
    .field { margin-bottom:1rem; }
    label { font-size:.74rem; color:var(--secondary-text); text-transform:uppercase; letter-spacing:.09em; display:block; margin-bottom:6px; }
    input, textarea, select { width:100%; padding:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); color:var(--primary-text); outline:none; }
    input:focus, textarea:focus, select:focus { border-color:rgba(255,65,54,.5); }
    .btn-primary { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-weight:700; cursor:pointer; }
    .btn-primary:hover { filter:brightness(1.05); }
  </style>
</head>
<body>
  <div class="page">
    <header class="tool-header">
      <a class="back-link" href="./"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1><span class="cube"></span> Tool Name</h1>
    </header>
    <p class="tool-desc">Replace this sentence with your tool description and usage guidance.</p>

    <main class="panel">
      <div class="field">
        <label for="input-example">Example Input</label>
        <input id="input-example" type="text" placeholder="Enter value">
      </div>
      <button class="btn-primary" id="run-btn">Run Tool</button>
    </main>
  </div>

  <script>
    document.getElementById('run-btn').addEventListener('click', () => {
      alert('Template action: wire up your tool logic here.');
    });
  </script>
</body>
</html>
