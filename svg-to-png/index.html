<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to PNG Converter | s17 Labs Tools</title>
    <meta name="description" content="Convert SVG files to high-quality PNG images locally in your browser. Batch processing, custom scaling, and zero server uploads.">
    <link rel="icon" type="image/x-icon" href="https://s17labs.github.io/src/assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary:#0e0e10; --accent:#ff4136; --primary-text:#f1f1f1; --secondary-text:#868686; --surface-2:#1a1a1c; --border:rgba(255,255,255,0.07); --accent-dim:rgba(255,65,54,0.12); --radius:4px; --t:.25s ease; }
        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--primary); color:var(--primary-text); font-family:Verdana,sans-serif; min-height:100vh; display:flex; justify-content:center; }
        .page { width:100%; max-width:900px; padding:0 20px 28px; display:flex; flex-direction:column; }
        .tool-header { width:100%; text-align:center; margin:2.5rem 0 .4rem; position:relative; display:flex; justify-content:center; align-items:center; min-height:2.8rem; }
        .back-link { position:absolute; left:0; color:var(--secondary-text); font-size:1rem; display:inline-flex; align-items:center; gap:.45rem; text-decoration:none; transition:var(--t); }
        .back-link:hover { color:var(--accent); }
        .tool-header h1 { font-family:Aldrich,sans-serif; font-size:1.8rem; display:inline-flex; align-items:center; gap:.25em; }
        .cube { width:.82em; height:.82em; background:var(--accent); transform:translateY(-.12em); }
        .tool-desc { text-align:center; color:var(--secondary-text); font-size:.95rem; margin:.6rem auto 2rem; line-height:1.55; max-width:760px; }
        .panel { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--radius); padding:1.4rem; }
        #drop-zone { border:1px dashed var(--border); border-radius:var(--radius); padding:30px 20px; text-align:center; cursor:pointer; background:rgba(255,255,255,.01); transition:var(--t); margin-bottom:20px; display:flex; flex-direction:column; align-items:center; gap:8px; }
        #drop-zone:hover,#drop-zone.hover { border-color:var(--accent); background:var(--accent-dim); }
        .upload-icon { font-size:2.5rem; color:var(--accent); margin-bottom:5px; }
        .sub-text { font-size:.85rem; color:var(--secondary-text); }
        #preview-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%; max-width:240px; margin-top:15px; }
        .thumb-container { position:relative; width:100%; aspect-ratio:1; border-radius:4px; overflow:hidden; border:1px solid var(--border); background:#fff; }
        .thumb { width:100%; height:100%; object-fit:contain; padding:4px; }
        .more-overlay { position:absolute; inset:0; background:rgba(0,0,0,.7); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; }
        .controls { margin-bottom:1rem; }
        label { font-size:.74rem; color:var(--secondary-text); text-transform:uppercase; letter-spacing:.09em; display:block; margin-bottom:6px; }
        input[type="number"] { width:100%; padding:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); color:var(--primary-text); outline:none; }
        input[type="number"]:focus { border-color:rgba(255,65,54,.5); }
        #download-btn { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-weight:700; font-size:.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
        #download-btn:disabled { opacity:.3; cursor:not-allowed; filter:grayscale(1); }
    </style>
</head>
<body>
<div class="page">
    <header class="tool-header">
        <a class="back-link" href="../"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1><span class="cube"></span> SVG to PNG</h1>
    </header>
    <p class="tool-desc">Convert single or multiple SVG files to transparent PNGs directly in your browser. No uploads, no waiting.</p>

    <main class="panel">
        <div id="drop-zone">
            <i class="fa-solid fa-vector-square upload-icon"></i>
            <div id="drop-text">Drag & drop SVGs or click to upload</div>
            <div class="sub-text">(Transparent PNG output)</div>
            <div id="preview-grid"></div>
            <input type="file" id="file-input" accept=".svg" multiple hidden>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>Output Width (px)</label>
                <input type="number" id="width-input" placeholder="Enter width">
                <p class="sub-text" style="margin-top: 5px;">Height scales automatically to preserve ratio.</p>
            </div>
        </div>

        <button id="download-btn" disabled>
            <i class="fa-solid fa-file-export"></i>
            <span id="btn-text">Convert & Download</span>
        </button>
    </main>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const widthInput = document.getElementById('width-input');
    const downloadBtn = document.getElementById('download-btn');
    const btnText = document.getElementById('btn-text');
    const previewGrid = document.getElementById('preview-grid');

    let svgFiles = [];

    dropZone.onclick = () => fileInput.click();
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('hover');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('hover'); handleFiles(e.dataTransfer.files); };
    fileInput.onchange = (e) => handleFiles(e.target.files);

    function handleFiles(files) {
        if (!files.length) return;
        svgFiles = [];
        const fileArray = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.svg'));
        if (fileArray.length === 0) return;

        btnText.innerText = fileArray.length > 1 ? 'Convert All to PNG' : 'Convert to PNG';
        previewGrid.innerHTML = '';

        fileArray.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const svgContent = e.target.result;
                const originalName = file.name.replace(/\.[^/.]+$/, '');
                svgFiles.push({ content: svgContent, name: originalName });

                if (index === 0) {
                    const tempImg = new Image();
                    const tempBlob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
                    const tempUrl = URL.createObjectURL(tempBlob);
                    tempImg.onload = () => {
                        if (!widthInput.value) widthInput.value = tempImg.width || 1024;
                        URL.revokeObjectURL(tempUrl);
                    };
                    tempImg.src = tempUrl;
                }

                if (index < 6) {
                    const container = document.createElement('div');
                    container.className = 'thumb-container';
                    const img = document.createElement('img');
                    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgContent)));
                    img.className = 'thumb';
                    container.appendChild(img);
                    if (fileArray.length > 6 && index === 5) {
                        const overlay = document.createElement('div');
                        overlay.className = 'more-overlay';
                        overlay.innerText = `+${fileArray.length - 5}`;
                        container.appendChild(overlay);
                    }
                    previewGrid.appendChild(container);
                }
                downloadBtn.disabled = false;
            };
            reader.readAsText(file);
        });
    }

    downloadBtn.onclick = async () => {
        const targetW = parseInt(widthInput.value) || 1024;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const zip = new JSZip();

        const originalBtnContent = downloadBtn.innerHTML;
        downloadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Converting...';

        for (const item of svgFiles) {
            const img = new Image();
            const svgBlob = new Blob([item.content], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            await new Promise(resolve => {
                img.onload = () => {
                    const ratio = img.width / img.height;
                    canvas.width = targetW;
                    canvas.height = targetW / ratio;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const pngData = canvas.toDataURL('image/png').split(',')[1];
                    zip.file(`${item.name}.png`, pngData, { base64: true });
                    URL.revokeObjectURL(url);
                    resolve();
                };
                img.src = url;
            });
        }

        if (svgFiles.length === 1) {
            const content = await zip.file(`${svgFiles[0].name}.png`).async('blob');
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${svgFiles[0].name}.png`;
            link.click();
        } else {
            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = 's17labs-svg-batch.zip';
            link.click();
        }
        downloadBtn.innerHTML = originalBtnContent;
    };
</script>
</body>
</html>
