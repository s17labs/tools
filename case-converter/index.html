<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Converter | s17 Labs Tools</title>
  <meta name="description" content="Convert strings between 15 programming and writing conventions — camelCase, snake_case, kebab-case, PascalCase, and more.">
  <meta property="og:title" content="Case Converter | s17 Labs Tools">
  <meta property="og:description" content="Convert strings between 15 programming and writing conventions — camelCase, snake_case, kebab-case, and more.">
  <meta property="og:site_name" content="s17 Labs Tools">
  <link rel="icon" type="image/x-icon" href="https://s17labs.github.io/src/assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <style>
    :root {
      --primary:        #0e0e10;
      --accent:         #ff4136;
      --primary-text:   #f1f1f1;
      --secondary-text: #868686;
      --btn-bg:         #1a1a1c;
      --surface-2:      #1a1a1c;
      --surface-3:      #222226;
      --border:         rgba(255,255,255,0.07);
      --accent-dim:     rgba(255,65,54,0.12);
      --radius:         4px;
      --t:              0.25s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--primary);
      color: var(--primary-text);
      font-family: Verdana, sans-serif;
      font-size: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    body::-webkit-scrollbar { display: none; }
    a { color: inherit; text-decoration: none; transition: var(--t); }

    .page {
      width: 100%;
      max-width: 680px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tool-header {
      width: 100%;
      text-align: center;
      margin: 2.5rem 0 0.4rem;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 2.8rem;
    }

    .back-link {
      position: absolute; left: 0;
      background: none; border: none;
      color: var(--secondary-text); cursor: pointer;
      font-size: 1rem; font-family: Verdana, sans-serif;
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0; transition: var(--t); text-decoration: none;
    }

    .back-link:hover { color: var(--accent); }

    .tool-header h1 {
      font-family: Aldrich, sans-serif;
      font-size: 1.8rem; line-height: 1;
      display: inline-flex; align-items: center; gap: 0.25em;
    }

    .cube {
      display: inline-block;
      width: 0.82em; height: 0.82em;
      background: var(--accent);
      transform: translateY(-0.12em);
      flex-shrink: 0;
    }

    .tool-desc {
      text-align: center;
      color: var(--secondary-text);
      font-size: 0.95rem;
      margin: 0.6rem 0 2rem;
      line-height: 1.55;
    }

    .panel {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      margin-bottom: 1rem;
    }

    .panel-title {
      font-family: Aldrich, sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--secondary-text);
      margin-bottom: 1.1rem;
    }

    /* Textarea */
    textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--primary-text);
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      padding: 0.8rem;
      resize: vertical;
      min-height: 90px;
      outline: none;
      transition: border-color var(--t);
      line-height: 1.5;
    }

    textarea:focus { border-color: rgba(255,65,54,0.5); }
    textarea::placeholder { color: var(--secondary-text); opacity: 0.45; }

    /* Case format buttons */
    .case-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .case-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.15rem;
      padding: 0.5rem 0.75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--t);
      color: var(--secondary-text);
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      white-space: nowrap;
      text-align: left;
    }

    .case-btn:hover { border-color: rgba(255,65,54,0.4); color: var(--primary-text); }
    .case-btn.active { border-color: var(--accent); background: var(--accent-dim); color: var(--primary-text); }

    .case-btn .case-preview {
      font-size: 0.65rem;
      color: var(--secondary-text);
      opacity: 0.6;
      font-family: 'Courier New', monospace;
    }

    .case-btn.active .case-preview { opacity: 0.8; }

    /* Output */
    .output-wrap { position: relative; }

    textarea#output {
      resize: none;
      min-height: 90px;
      cursor: default;
    }

    .copy-btn {
      position: absolute;
      top: 0.5rem; right: 0.5rem;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--secondary-text);
      padding: 0.3rem 0.65rem;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: Verdana, sans-serif;
      transition: all var(--t);
      display: flex; align-items: center; gap: 0.35rem;
    }

    .copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* More tools */
    .more-tools { width: 100%; margin: 2.5rem 0 0; padding: 2rem 0 0; border-top: 1px solid var(--border); text-align: center; }
    .more-tools h3 { font-family: Aldrich, sans-serif; font-size: 1.1rem; margin-bottom: 0.55rem; }
    .more-tools p { color: var(--secondary-text); font-size: 0.9rem; margin-bottom: 1.4rem; line-height: 1.5; }

    .more-tools-btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-size: 1rem; background: var(--btn-bg);
      border: 1px solid transparent; color: var(--secondary-text);
      cursor: pointer; padding: 0.75rem 1.4rem;
      border-radius: var(--radius); font-family: Verdana, sans-serif;
      transition: var(--t); text-decoration: none;
    }

    .more-tools-btn:hover { background: var(--accent); color: var(--primary-text); }

    .footer { width: 100%; padding: 2rem 0 1.5rem; color: var(--secondary-text); opacity: 0.65; font-size: 0.95rem; text-align: center; margin-top: auto; }
    .footer a:hover, .footer a:active { color: var(--accent); text-decoration: underline; }

    @media (max-width: 580px) {
      .tool-header h1 { font-size: 1.5rem; }
      .case-btn { padding: 0.4rem 0.6rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="tool-header">
    <a href="https://s17labs.github.io/tools/" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Tools
    </a>
    <h1><span class="cube"></span> Case Converter</h1>
  </div>
  <p class="tool-desc">Convert text between 15 programming conventions and writing formats — instantly, in your browser.</p>

  <!-- Input -->
  <div class="panel">
    <div class="panel-title">Input</div>
    <textarea id="input" placeholder="Type or paste text here…" spellcheck="false" autocomplete="off"></textarea>
  </div>

  <!-- Format selector -->
  <div class="panel">
    <div class="panel-title">Format</div>
    <div class="case-grid" id="case-grid"></div>
  </div>

  <!-- Output -->
  <div class="panel">
    <div class="panel-title">Output</div>
    <div class="output-wrap">
      <textarea id="output" readonly spellcheck="false"></textarea>
      <button class="copy-btn" id="copy-btn" onclick="copyOutput()">
        <i class="fa-regular fa-copy"></i> Copy
      </button>
    </div>
  </div>

  <div class="more-tools">
    <h3>More s17 Labs Tools</h3>
    <p>Discover more free, browser-based utilities designed for creators and developers.</p>
    <a href="https://s17labs.github.io/tools/" class="more-tools-btn">
      <i class="fa-solid fa-arrow-left"></i> View More Tools
    </a>
  </div>

  <footer class="footer">
    © <script>document.write(new Date().getFullYear())</script> <b>s17 Labs</b>
    &bull;
    <a href="https://github.com/s17labs/tools" target="_blank">
      <i class="fa-brands fa-github"></i> Source Code
    </a>
  </footer>

</div>

<script>
  // ── Case conversion functions ─────────────────────────────────────────────
  function words(str) {
    return str
      .replace(/([a-z])([A-Z])/g, '$1 $2')         // split camelCase
      .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')   // split acronyms
      .replace(/[-_./]+/g, ' ')                      // split separators
      .replace(/[^a-zA-Z0-9\s]/g, '')               // strip special chars
      .trim()
      .split(/\s+/)
      .filter(Boolean);
  }

  const FORMATS = [
    {
      id:      'lower',
      label:   'lowercase',
      preview: 'hello world',
      fn:      s => words(s).join(' ').toLowerCase()
    },
    {
      id:      'upper',
      label:   'UPPERCASE',
      preview: 'HELLO WORLD',
      fn:      s => words(s).join(' ').toUpperCase()
    },
    {
      id:      'camel',
      label:   'camelCase',
      preview: 'helloWorld',
      fn:      s => {
        const w = words(s);
        return w[0].toLowerCase() + w.slice(1).map(cap).join('');
      }
    },
    {
      id:      'pascal',
      label:   'PascalCase',
      preview: 'HelloWorld',
      fn:      s => words(s).map(cap).join('')
    },
    {
      id:      'snake',
      label:   'snake_case',
      preview: 'hello_world',
      fn:      s => words(s).join('_').toLowerCase()
    },
    {
      id:      'kebab',
      label:   'kebab-case',
      preview: 'hello-world',
      fn:      s => words(s).join('-').toLowerCase()
    },
    {
      id:      'title',
      label:   'Title Case',
      preview: 'Hello World',
      fn:      s => words(s).map(cap).join(' ')
    },
    {
      id:      'sentence',
      label:   'Sentence case',
      preview: 'Hello world',
      fn:      s => {
        const w = words(s);
        if (!w.length) return '';
        return cap(w[0]) + (w.slice(1).length ? ' ' + w.slice(1).join(' ').toLowerCase() : '');
      }
    },
    {
      id:      'screaming',
      label:   'SCREAMING_SNAKE',
      preview: 'HELLO_WORLD',
      fn:      s => words(s).join('_').toUpperCase()
    },
    {
      id:      'cobol',
      label:   'COBOL-CASE',
      preview: 'HELLO-WORLD',
      fn:      s => words(s).join('-').toUpperCase()
    },
    {
      id:      'dot',
      label:   'dot.case',
      preview: 'hello.world',
      fn:      s => words(s).join('.').toLowerCase()
    },
    {
      id:      'path',
      label:   'path/case',
      preview: 'hello/world',
      fn:      s => words(s).join('/').toLowerCase()
    },
    {
      id:      'train',
      label:   'Train-Case',
      preview: 'Hello-World',
      fn:      s => words(s).map(cap).join('-')
    },
    {
      id:      'flat',
      label:   'flatcase',
      preview: 'helloworld',
      fn:      s => words(s).join('').toLowerCase()
    },
    {
      id:      'upperflat',
      label:   'UPPERFLAT',
      preview: 'HELLOWORLD',
      fn:      s => words(s).join('').toUpperCase()
    },
  ];

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }

  // ── State ─────────────────────────────────────────────────────────────────
  let activeFormat = FORMATS[4]; // snake_case default

  // ── Build format buttons ──────────────────────────────────────────────────
  const grid = document.getElementById('case-grid');

  FORMATS.forEach(fmt => {
    const btn = document.createElement('button');
    btn.className = 'case-btn' + (fmt.id === activeFormat.id ? ' active' : '');
    btn.dataset.id = fmt.id;
    btn.innerHTML = `<span>${fmt.label}</span><span class="case-preview">${fmt.preview}</span>`;
    btn.addEventListener('click', () => {
      activeFormat = fmt;
      document.querySelectorAll('.case-btn').forEach(b => b.classList.toggle('active', b.dataset.id === fmt.id));
      convert();
    });
    grid.appendChild(btn);
  });

  // ── Conversion ────────────────────────────────────────────────────────────
  const inputEl  = document.getElementById('input');
  const outputEl = document.getElementById('output');

  function convert() {
    const raw = inputEl.value;
    outputEl.value = raw ? activeFormat.fn(raw) : '';
  }

  inputEl.addEventListener('input', convert);

  // ── Copy ─────────────────────────────────────────────────────────────────
  function copyOutput() {
    const val = outputEl.value;
    if (!val) return;
    navigator.clipboard.writeText(val).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
      setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy'; }, 1800);
    });
  }
</script>
</body>
</html>
