<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter | s17 Labs Tools</title>
    <meta name="description" content="A fast, free, and secure case converter by s17 Labs. Convert text to camelCase, snake_case, PascalCase, and more instantly in your browser.">
    <link rel="icon" type="image/x-icon" href="https://s17labs.github.io/src/assets/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary:#0e0e10; --accent:#ff4136; --primary-text:#f1f1f1; --secondary-text:#868686; --surface-2:#1a1a1c; --border:rgba(255,255,255,.07); --accent-dim:rgba(255,65,54,.12); --blue-action:#0074d9; --green-action:#2ecc40; --red-action:#ff4136; --radius:4px; --t:.25s ease; }
        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Verdana,sans-serif; background:var(--primary); color:var(--primary-text); min-height:100vh; display:flex; justify-content:center; }
        .page { width:100%; max-width:900px; padding:0 20px 28px; display:flex; flex-direction:column; }
        .tool-header { width:100%; text-align:center; margin:2.5rem 0 .4rem; position:relative; display:flex; justify-content:center; align-items:center; min-height:2.8rem; }
        .back-link { position:absolute; left:0; color:var(--secondary-text); font-size:1rem; display:inline-flex; align-items:center; gap:.45rem; text-decoration:none; transition:var(--t); }
        .back-link:hover { color:var(--accent); }
        .tool-header h1 { font-family:Aldrich,sans-serif; font-size:1.8rem; display:inline-flex; align-items:center; gap:.25em; }
        .cube { width:.82em; height:.82em; background:var(--accent); transform:translateY(-.12em); }
        .tool-desc { text-align:center; color:var(--secondary-text); font-size:.95rem; margin:.6rem auto 2rem; line-height:1.55; max-width:760px; }
        .panel { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--radius); padding:1.4rem; }
        .editor-container { position:relative; width:100%; margin-bottom:1rem; }
        textarea { width:100%; height:240px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); color:var(--primary-text); font-family:'Fira Code',monospace; font-size:15px; padding:15px 55px 15px 15px; resize:vertical; outline:none; }
        textarea:focus { border-color:rgba(255,65,54,.5); }
        .input-overlay-actions { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:8px; z-index:10; }
        .overlay-btn { background-color:var(--surface-2); border:1px solid var(--border); color:var(--secondary-text); border-radius:4px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:var(--t); position:relative; }
        .overlay-btn:hover { color:var(--primary-text); border-color:rgba(255,65,54,.4); }
        .overlay-btn::after { content:attr(data-tooltip); position:absolute; right:48px; background:#000; color:#fff; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:600; white-space:nowrap; opacity:0; pointer-events:none; transition:all .2s ease; transform:translateX(10px); border:1px solid var(--border); }
        .overlay-btn:hover::after { opacity:1; transform:translateX(0); }
        .success-paste { color:var(--blue-action)!important; border-color:var(--blue-action)!important; background:rgba(0,116,217,.1)!important; }
        .success-copy { color:var(--green-action)!important; border-color:var(--green-action)!important; background:rgba(46,204,64,.1)!important; }
        .success-clear { color:var(--red-action)!important; border-color:var(--red-action)!important; background:rgba(255,65,54,.1)!important; }
        .action-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
        .btn { padding:12px 8px; border:1px solid var(--border); border-radius:var(--radius); font-family:'Fira Code',monospace; cursor:pointer; font-size:.78rem; background:var(--surface-2); color:var(--primary-text); transition:var(--t); text-align:center; }
        .btn:hover { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
        .btn-more { background:transparent; border:1px solid var(--accent); color:var(--accent); font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; }
        .extra-cases { display:none; }
        .show-extra .extra-cases { display:contents; }
        @media (max-width: 700px) { .action-grid { grid-template-columns:repeat(2,1fr); } .overlay-btn::after { display:none; } }
    </style>
</head>
<body id="body-wrapper">
<div class="page">
    <header class="tool-header">
        <a class="back-link" href="../"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1><span class="cube"></span> Case Converter</h1>
    </header>
    <p class="tool-desc">Convert text between common coding and writing case formats instantly, fully client-side.</p>

    <main class="panel">
        <div class="editor-container">
            <textarea id="text-input" placeholder="Enter text here..."></textarea>
            <div class="input-overlay-actions">
                <button class="overlay-btn" id="paste-btn" data-tooltip="Paste Text"><i class="fa-solid fa-paste"></i></button>
                <button class="overlay-btn" id="copy-btn" data-tooltip="Copy Text"><i class="fa-solid fa-copy"></i></button>
                <button class="overlay-btn" id="clear-btn" data-tooltip="Clear All"><i class="fa-solid fa-trash-can"></i></button>
            </div>
        </div>

        <div class="action-grid" id="main-grid">
            <button class="btn" onclick="convert('lower')">lowercase</button>
            <button class="btn" onclick="convert('upper')">UPPERCASE</button>
            <button class="btn" onclick="convert('camel')">camelCase</button>
            <button class="btn" onclick="convert('pascal')">PascalCase</button>
            <button class="btn" onclick="convert('snake')">snake_case</button>
            <button class="btn" onclick="convert('kebab')">kebab-case</button>
            <button class="btn" onclick="convert('title')">Title Case</button>
            <button class="btn btn-more" id="more-toggle" onclick="toggleMore()"><i class="fa-solid fa-chevron-down"></i> More</button>
            <div class="extra-cases">
                <button class="btn" onclick="convert('screaming')">SCREAMING_SNAKE</button>
                <button class="btn" onclick="convert('cobol')">COBOL-CASE</button>
                <button class="btn" onclick="convert('sentence')">Sentence case</button>
                <button class="btn" onclick="convert('dot')">dot.case</button>
                <button class="btn" onclick="convert('path')">path/case</button>
                <button class="btn" onclick="convert('train')">Train-Case</button>
                <button class="btn" onclick="convert('flat')">flatcase</button>
                <button class="btn" onclick="convert('upperflat')">UPPERFLAT</button>
            </div>
        </div>
    </main>
</div>
<script>
    const inputArea = document.getElementById('text-input');
    const wrapper = document.getElementById('body-wrapper');
    const toggleBtn = document.getElementById('more-toggle');

    function toggleMore() {
        const isShowing = wrapper.classList.toggle('show-extra');
        toggleBtn.innerHTML = isShowing
            ? '<i class="fa-solid fa-chevron-up"></i> Less'
            : '<i class="fa-solid fa-chevron-down"></i> More';
    }

    function convert(type) {
        let str = inputArea.value.trim();
        if (!str) return;

        const words = str.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[._\-\/]/g, ' ').toLowerCase().split(/\s+/).filter(w => w.length > 0);

        let result = '';
        switch (type) {
            case 'lower': result = str.toLowerCase(); break;
            case 'upper': result = str.toUpperCase(); break;
            case 'camel': result = words.map((w, i) => i === 0 ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(''); break;
            case 'pascal': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(''); break;
            case 'snake': result = words.join('_'); break;
            case 'kebab': result = words.join('-'); break;
            case 'title': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); break;
            case 'screaming': result = words.join('_').toUpperCase(); break;
            case 'cobol': result = words.join('-').toUpperCase(); break;
            case 'sentence': result = words.map((w, i) => i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w).join(' '); break;
            case 'dot': result = words.join('.'); break;
            case 'path': result = words.join('/'); break;
            case 'train': result = words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('-'); break;
            case 'flat': result = words.join(''); break;
            case 'upperflat': result = words.join('').toUpperCase(); break;
        }
        inputArea.value = result;
    }

    function flashBtn(id, cls) {
        const btn = document.getElementById(id);
        const icon = btn.querySelector('i');
        const originalIcon = icon.className;
        btn.classList.add(cls);
        icon.className = 'fa-solid fa-check';
        setTimeout(() => { btn.classList.remove(cls); icon.className = originalIcon; }, 1000);
    }

    document.getElementById('paste-btn').onclick = async () => {
        try {
            const text = await navigator.clipboard.readText();
            if (text) { inputArea.value = text; flashBtn('paste-btn', 'success-paste'); }
        } catch (e) { alert('Clipboard permission required.'); }
    };
    document.getElementById('copy-btn').onclick = () => {
        if (!inputArea.value) return;
        navigator.clipboard.writeText(inputArea.value);
        flashBtn('copy-btn', 'success-copy');
    };
    document.getElementById('clear-btn').onclick = () => {
        inputArea.value = '';
        flashBtn('clear-btn', 'success-clear');
    };
</script>
</body>
</html>
